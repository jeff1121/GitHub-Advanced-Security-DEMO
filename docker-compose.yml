services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bingo}
      POSTGRES_DB: ${POSTGRES_DB:-bingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-local-env.sh --apply first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [local]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 4s
      retries: 10
  redis:
    image: redis:7-alpine
    networks: [local]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 4s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-bingo}:${POSTGRES_PASSWORD:?Local database password required}@postgres:5432/${POSTGRES_DB:-bingo}
      JWT_SECRET: ${JWT_SECRET:?Local JWT secret required}
      MOCK_AZURE: 'true'
      DEMO_FAST_MODE: ${DEMO_FAST_MODE:-true}
    volumes:
      - blobs:/app/.data/blobs
    networks: [local]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:8080:8080'
    networks: [local, ingress]
    depends_on:
      api: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  scoring:
    build:
      context: .
      dockerfile: apps/scoring/Dockerfile
    networks: [local]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  local:
    internal: true
  ingress: {}
volumes:
  postgres_data:
  blobs:
